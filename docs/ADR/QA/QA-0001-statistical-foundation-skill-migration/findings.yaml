  - id: QA-0001-F05
    title: Documented explicit BIC formula does not match implemented BIC
    category: contradictory-evidence
    purpose_classification: spec-required
    severity: medium
    severity_rationale: "Model selection is a core contract. Implemented BIC = -2ll + k ln N reproduces validation M1=1160.18, but Plan, report, dashboard, and stats_bayesian.md publish other formulas."
    status: open
    technical_disposition: failed
    owner_disposition: null
    first_seen_cycle: 1
    claim_refs: [CLAIM-002]
    requirement_refs: [PLAN-2.3, VALIDATION-4.2]
    evidence:
      - type: code
        reference: "pass1_compute.R bic_explicit <- -2 * ll + k_param * log(total_n); Titanic M1 bic=1160.1817"
        revision: "3d5fb36d1ab02210a721b10fe0c8b56b9a987b09"
      - type: specification
        reference: "Plan 2.3 writes BIC = G^2 - df ln N; report and dashboard write BIC = Deviance + df_used ln N"
        revision: "3d5fb36d1ab02210a721b10fe0c8b56b9a987b09"
      - type: code
        reference: "Independent check: M1 deviance 1018.3249 + 10*ln(2201) = 1095.29, not 1160.18"
        revision: "3d5fb36d1ab02210a721b10fe0c8b56b9a987b09"
    limitations: ["Ranking among the 9 models may still coincide under affine transforms; the published equation is still false relative to the numbers"]
    requested_action: "Publish a single BIC equation matching the code and validation report, and remove the Deviance+df ln N statement from dashboard and stats_bayesian.md."
    risk_acceptance:
      owner: null
      rationale: null
      scope_or_assumptions: null
      compensating_controls: []
      expiry_or_review_trigger: null
    fingerprint:
      category: contradictory-evidence
      requirement_id: PLAN-2.3
      primary_path: .agents/skills/vcd-bayesian-evidence-analysis/templates/pass1_compute.R
      semantic_key: explicit-bic-formula-mismatch
    author_response:
      disposition: fix-submitted
      summary: "Harmonized explicit BIC definition across all documentation and dashboard to Poisson full log-likelihood basis: BIC = -2*ln(L) + p*ln(N). Removed Deviance-based formula; verified exact match with M1 bic=1160.1817."
      revision: "c0ecbc16057a66c61fcf1e4aeb0b4b207eb08480"
      cycle: 1
      evidence: "docs/reference/loglinear_models_bic.md and dashboard.Rmd glossary reflect BIC = -2*ln(L) + p*ln(N)."
    verification: null

